[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200

[[redirects]]
  from = "/api/admin-auth"
  to = "/.netlify/functions/admin-auth"
  status = 200

[[redirects]]
  from = "/api/visitors"
  to = "/.netlify/functions/visitors"
  status = 200

[[redirects]]
  from = "/api/themes"
  to = "/.netlify/functions/themes"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
